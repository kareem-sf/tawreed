[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tawreed"
version = "0.1.0"
description = "Headless BOQ classification engine embedded in the Tawreed Tauri desktop app."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Kareem Safwat", email = "kareem@kareemsafwat.com" },
]
keywords = ["boq", "construction", "tauri", "quantity-surveying", "ai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<27",
  "openai>=1.30,<3",
  "openpyxl>=3.1,<4",
  "secretstorage>=3.3; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pre-commit>=3.7",
  "pyinstaller>=6",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
]

[project.scripts]
tawreed-engine = "tawreed_engine.__main__:main"

[project.urls]
Repository = "https://github.com/sfkareem/tawreed"
Issues = "https://github.com/sfkareem/tawreed/issues"

[tool.setuptools.packages.find]
include = ["core", "tawreed_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --tb=short --strict-config --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  ".build",
  ".venv",
  ".venv-*",
  "build",
  "dist",
  "node_modules",
  "target",
]

[tool.ruff.lint]
select = ["B", "F", "I", "UP", "W"]
ignore = [
  "B008",
  "UP031",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "UP033"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
