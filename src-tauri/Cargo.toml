[package]
name = "tawreed"
version = "0.2.0"
edition = "2021"
rust-version = "1.80"
description = "Portable BOQ → work-package workbook converter"
license = "MIT"
authors = ["Kareem Safwat"]
repository = "https://github.com/sfkareem/tawreed"
homepage = "https://github.com/sfkareem/tawreed"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
dotenvy = "0.15"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
semver = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
