[package]
name = "tawreed"
version = "0.5.6"
edition = "2021"
rust-version = "1.88"
description = "Portable BOQ → work-package workbook converter"
license = "MIT"
authors = ["Kareem Safwat"]
repository = "https://github.com/kareem-sf/tawreed"
homepage = "https://github.com/kareem-sf/tawreed"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["macros", "time", "fs", "io-util", "sync", "process"] }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
dotenvy = "0.15"
base64 = "0.22"
ed25519-dalek = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
semver = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
