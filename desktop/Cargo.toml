[package]
name = "tawreed-desktop"
version = "0.0.2"
description = "Tawreed desktop window"
edition = "2024"
license-file = "../LICENSE"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"  # signed updates from the address in tauri.release.conf.json
serde_json = "1"  # Tauri release context expands plugin configuration through this crate
getrandom = "0.3"  # the service's access token
ureq = { version = "3", default-features = false }  # forwards the interface's requests to the service (plain http on this computer, so no TLS or gzip)
tauri-plugin-single-instance = "2"  # a second Tawreed focuses the first instead of starting a second service
tauri-plugin-window-state = "2"  # remembers the window's size and position

[target.'cfg(unix)'.dependencies]
libc = "0.2"  # stops the service's whole process group

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }  # a job that ends the service with Tawreed
