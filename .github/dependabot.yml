version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Cairo
    groups:
      npm-minor:
        applies-to: version-updates
        update-types: [minor, patch]
    # pdfjs-dist and tesseract.js are deliberately absent: public/ vendors
    # runtime assets pinned to them, so their major updates must surface as
    # PRs. Dependabot ignore rules are additive (a wildcard cannot be
    # overridden per package), so the blanket is an explicit list — add new
    # direct dependencies here to keep their major updates blocked.
    ignore:
      - dependency-name: "@e965/xlsx"
        update-types: [version-update:semver-major]
      - dependency-name: "@radix-ui/react-accordion"
        update-types: [version-update:semver-major]
      - dependency-name: "@radix-ui/react-alert-dialog"
        update-types: [version-update:semver-major]
      - dependency-name: "@radix-ui/react-dialog"
        update-types: [version-update:semver-major]
      - dependency-name: "@radix-ui/react-label"
        update-types: [version-update:semver-major]
      - dependency-name: "@radix-ui/react-popover"
        update-types: [version-update:semver-major]
      - dependency-name: "@radix-ui/react-progress"
        update-types: [version-update:semver-major]
      - dependency-name: "@radix-ui/react-radio-group"
        update-types: [version-update:semver-major]
      - dependency-name: "@radix-ui/react-select"
        update-types: [version-update:semver-major]
      - dependency-name: "@radix-ui/react-separator"
        update-types: [version-update:semver-major]
      - dependency-name: "@radix-ui/react-slot"
        update-types: [version-update:semver-major]
      - dependency-name: "@radix-ui/react-tabs"
        update-types: [version-update:semver-major]
      - dependency-name: "@radix-ui/react-tooltip"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      - dependency-name: "@playwright/test"
        update-types: [version-update:semver-major]
      - dependency-name: "@tailwindcss/vite"
        update-types: [version-update:semver-major]
      - dependency-name: "@tauri-apps/api"
        update-types: [version-update:semver-major]
      - dependency-name: "@tauri-apps/cli"
        update-types: [version-update:semver-major]
      - dependency-name: "@testing-library/dom"
        update-types: [version-update:semver-major]
      - dependency-name: "@testing-library/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]
      - dependency-name: "@vitest/coverage-v8"
        update-types: [version-update:semver-major]
      - dependency-name: "class-variance-authority"
        update-types: [version-update:semver-major]
      - dependency-name: "clsx"
        update-types: [version-update:semver-major]
      - dependency-name: "cmdk"
        update-types: [version-update:semver-major]
      - dependency-name: "edge-tts-universal"
        update-types: [version-update:semver-major]
      - dependency-name: "eslint"
        update-types: [version-update:semver-major]
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: [version-update:semver-major]
      - dependency-name: "exceljs"
        update-types: [version-update:semver-major]
      - dependency-name: "globals"
        update-types: [version-update:semver-major]
      - dependency-name: "i18next"
        update-types: [version-update:semver-major]
      - dependency-name: "jsdom"
        update-types: [version-update:semver-major]
      - dependency-name: "liquid-gooey"
        update-types: [version-update:semver-major]
      - dependency-name: "lucide-react"
        update-types: [version-update:semver-major]
      - dependency-name: "metal-fx"
        update-types: [version-update:semver-major]
      - dependency-name: "motion"
        update-types: [version-update:semver-major]
      - dependency-name: "pdf-lib"
        update-types: [version-update:semver-major]
      - dependency-name: "react"
        update-types: [version-update:semver-major]
      - dependency-name: "react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: "react-i18next"
        update-types: [version-update:semver-major]
      - dependency-name: "react-window"
        update-types: [version-update:semver-major]
      - dependency-name: "tailwind-merge"
        update-types: [version-update:semver-major]
      - dependency-name: "tailwindcss"
        update-types: [version-update:semver-major]
      - dependency-name: "thinking-orbs"
        update-types: [version-update:semver-major]
      - dependency-name: "tw-animate-css"
        update-types: [version-update:semver-major]
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]
      - dependency-name: "typescript-eslint"
        update-types: [version-update:semver-major]
      - dependency-name: "vite"
        update-types: [version-update:semver-major]
      - dependency-name: "vitest"
        update-types: [version-update:semver-major]
      - dependency-name: "zod"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: deps
    labels: [dependencies, automated]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Cairo
    groups:
      cargo-minor:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: deps(rust)
    labels: [dependencies, automated]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Cairo
    commit-message:
      prefix: ci
    labels: [dependencies, automated, ci]
