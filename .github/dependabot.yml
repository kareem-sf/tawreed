version: 2

updates:
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Cairo
    groups:
      desktop-minor:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: deps(desktop)
    labels: [dependencies, automated]

  - package-ecosystem: npm
    directory: /marketing-video
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Cairo
    groups:
      remotion-minor:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: deps(video)
    labels: [dependencies, automated]

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Cairo
    groups:
      tauri-minor:
        applies-to: version-updates
        update-types: [minor, patch]
    commit-message:
      prefix: deps(tauri)
    labels: [dependencies, automated]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Cairo
    groups:
      python-minor:
        applies-to: version-updates
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(python)
    labels: [dependencies, automated]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Cairo
    commit-message:
      prefix: ci
    labels: [dependencies, automated, ci]
