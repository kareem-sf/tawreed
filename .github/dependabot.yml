version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Cairo
    groups:
      npm-minor:
        applies-to: version-updates
        update-types: [minor, patch]
    # pdfjs-dist and tesseract.js are deliberately absent: public/ vendors
    # runtime assets pinned to them, so their major updates must surface as
    # PRs. Dependabot ignore rules are additive (a wildcard cannot be
    # overridden per package), so the blanket is an explicit list — add new
    # direct dependencies here to keep their major updates blocked.
    ignore:
      - dependency-name: "@e965/xlsx"
        update-types: [version-update:semver-major]
      - dependency-name: "@mantine/core"
        update-types: [version-update:semver-major]
      - dependency-name: "@tailwindcss/vite"
        update-types: [version-update:semver-major]
      - dependency-name: "@tauri-apps/api"
        update-types: [version-update:semver-major]
      - dependency-name: "@tauri-apps/cli"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]
      - dependency-name: "@vitest/coverage-v8"
        update-types: [version-update:semver-major]
      - dependency-name: "clsx"
        update-types: [version-update:semver-major]
      - dependency-name: "exceljs"
        update-types: [version-update:semver-major]
      - dependency-name: "i18next"
        update-types: [version-update:semver-major]
      - dependency-name: "lucide-react"
        update-types: [version-update:semver-major]
      - dependency-name: "motion"
        update-types: [version-update:semver-major]
      - dependency-name: "pdf-lib"
        update-types: [version-update:semver-major]
      - dependency-name: "react"
        update-types: [version-update:semver-major]
      - dependency-name: "react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: "react-i18next"
        update-types: [version-update:semver-major]
      - dependency-name: "tailwindcss"
        update-types: [version-update:semver-major]
      - dependency-name: "typescript"
        update-types: [version-update:semver-major]
      - dependency-name: "vite"
        update-types: [version-update:semver-major]
      - dependency-name: "vitest"
        update-types: [version-update:semver-major]
      - dependency-name: "zod"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: deps
    labels: [dependencies, automated]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Cairo
    groups:
      cargo-minor:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: deps(rust)
    labels: [dependencies, automated]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Africa/Cairo
    commit-message:
      prefix: ci
    labels: [dependencies, automated, ci]
