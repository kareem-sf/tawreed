name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend, tests, build, assets, and version
        run: npm run check

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build portable Windows executable
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --locked

      - name: Verify portable executable
        shell: pwsh
        run: |
          $exe = Get-Item "src-tauri/target/release/tawreed.exe"
          $expected = (Get-Content "package.json" | ConvertFrom-Json).version
          if ($exe.Length -lt 10MB) { throw "Portable executable is unexpectedly small." }
          if ($exe.VersionInfo.ProductVersion -ne $expected) {
            throw "Executable version $($exe.VersionInfo.ProductVersion) does not match $expected."
          }
