name: CI
# Runs the test suite on every push to master and on every PR.
# Matrix: Python 3.10 / 3.11 / 3.12 on Ubuntu and Windows.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PySide6 needs the platform's EGL/GL stack at import time, even
      # when running under the offscreen QPA platform plugin (the
      # tests set QT_QPA_PLATFORM=offscreen but libEGL.so.1 still has
      # to be present for Qt to dlopen the platform plugin). Windows
      # runners ship with the OpenGL libs already, so we only install
      # on Linux.
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libdbus-1-3

      - name: Install
        run: pip install -e ".[dev]"

      # Pre-commit enforces the same lint/format rules that
      # local development does. The previous v0.0.1 shipped with
      # hardcoded "sk-..." test fixtures and plaintext api_key
      # references because pre-commit wasn't wired into CI. Adding
      # it here makes "I forgot to run pre-commit" a CI failure,
      # not a release-blocker follow-up PR.
      - name: Pre-commit
        # SKIP is set in the `env:` block (cross-shell safe)
        # rather than as a `VAR=val` prefix on the command line,
        # because Windows runners use PowerShell, which doesn't
        # understand the bash `VAR=val` prefix syntax.
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure
        env:
          # The local `pytest-fast` hook in .pre-commit-config.yaml
          # is hard-coded to `.\.venv-test\Scripts\python.exe`
          # (Windows path) and only meant for local dev. CI's
          # own `Test` step below already runs the full test
          # suite, so skip the duplicate local hook here.
          SKIP: pytest-fast
        continue-on-error: false

      - name: Ruff quality gate
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Test
        run: pytest -q

      # Security: scan for known vulnerabilities in dependencies
      - name: Dependency Security Scan
        run: |
          pip install pip-audit
          pip-audit --strict --format json > security-scan.json || true
          # Print human-readable output to logs
          pip-audit --strict
        continue-on-error: true
        env:
          # Only fail on critical vulnerabilities in CI
          PIP_AUDIT_STRICT: "false"

      # Generate Software Bill of Materials (SBOM)
      - name: Generate SBOM
        run: |
          python scripts/generate_sbom.py --format json --output sbom.json --source pyproject
          python scripts/generate_sbom.py --format csv --output sbom.csv --source pyproject
        continue-on-error: true

  package-smoke:
    name: Clean wheel install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install and verify outside the repository
        shell: bash
        run: |
          python -m venv /tmp/tawreed-wheel-smoke
          /tmp/tawreed-wheel-smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/tawreed-wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          import main
          from gui.assets import APP_ICON_PATH, LOGO_PNG_PATH, ROOT
          from tawreed_app import __version__

          assert version("tawreed") == __version__
          assert APP_ICON_PATH.is_file()
          assert LOGO_PNG_PATH.is_file()
          assert (ROOT / "themes" / "tawreed_dark.qss").is_file()
          print("wheel smoke test passed")
          PY
