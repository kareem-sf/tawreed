name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  service:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/pyproject.toml
      - run: pip install -e "./service[dev]"
      - run: ruff check service && ruff format --check service
      - run: pytest service

  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: service/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: python -m venv service/.venv && service/.venv/bin/pip install -e ./service
      - run: npm ci
      - name: API types match the service
        run: npm run bindings && git diff --exit-code ui/src/api
      - run: npm run typecheck
      - run: npm run test:ui
      # Thmanyah is not in the repository (licence); the build falls back to the system Arabic font.
      - run: npx vite build

  desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The runner's own rustup, rather than a third-party action.
      - run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - run: cargo +stable clippy --manifest-path desktop/Cargo.toml -- -D warnings

  # The check main's branch protection requires. It runs whatever happened above and passes only when every job
  # passed: a failed, cancelled or skipped job fails it (a skipped required check would otherwise count as passing).
  release-gate:
    name: Release gate
    if: always()
    needs: [service, interface, desktop]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "Every check passed."
