name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # v1
        with:
          toolchain: 1.97.0
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend, tests, build, assets, and version
        run: npm run check

      - name: Audit npm dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Install cargo-audit
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit -f src-tauri/Cargo.lock

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build portable Windows executable
        run: npm run tauri -- build --no-bundle --ci -- --locked

      - name: Verify portable executable
        shell: pwsh
        run: |
          $exe = Get-Item "src-tauri/target/release/tawreed.exe"
          $expected = (Get-Content "package.json" | ConvertFrom-Json).version
          if ($exe.Length -lt 10MB) { throw "Portable executable is unexpectedly small." }
          if ($exe.VersionInfo.ProductVersion -ne $expected) {
            throw "Executable version $($exe.VersionInfo.ProductVersion) does not match $expected."
          }

  frontend-tests:
    name: Frontend tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

  platform-builds:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            rust-targets: x86_64-unknown-linux-gnu
          - name: macOS universal
            runner: macos-15-intel
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # v1
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run tauri -- build --bundles appimage,deb --ci -- --locked

      - name: Verify Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test "$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | wc -l)" -eq 1
          test "$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(stat -c '%s' src-tauri/target/release/bundle/appimage/*.AppImage)" -gt 10000000
          xvfb-run -a bash -c '
            set -euo pipefail
            src-tauri/target/release/tawreed &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            sleep 8
            kill -0 "$pid"
          '

      # PR CI validates the native app bundle. DMG generation drives Finder/
      # hdiutil UI and is retried separately by the tagged release workflow.
      - name: Build universal macOS app
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --target universal-apple-darwin --bundles app --ci -- --locked

      - name: Verify universal macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app=src-tauri/target/universal-apple-darwin/release/bundle/macos/Tawreed.app
          executable="$app/Contents/MacOS/tawreed"
          test -d "$app"
          test "$(stat -f '%z' "$executable")" -gt 10000000
          archs="$(lipo -archs "$executable")"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
          codesign --verify --deep --strict "$app"

  release-gate:
    name: Release gate
    if: always()
    needs: [verify, frontend-tests, platform-builds]
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every CI job
        shell: bash
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          PLATFORM_RESULT: ${{ needs.platform-builds.result }}
        run: |
          set -euo pipefail
          printf 'verify=%s frontend=%s platforms=%s\n' \
            "$VERIFY_RESULT" "$FRONTEND_RESULT" "$PLATFORM_RESULT"
          [[ "$VERIFY_RESULT" == "success" ]]
          [[ "$FRONTEND_RESULT" == "success" ]]
          [[ "$PLATFORM_RESULT" == "success" ]]
