name: Portable Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v6

      - id: version
        name: Resolve release version
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("desktop/src-tauri/tauri.conf.json"))["version"])')"
          expected_tag="desktop-v${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match desktop version ${version}." >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            tag="${expected_tag}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Create draft portable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          notes="Direct portable executables only. No installer or archive assets are generated."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --draft --prerelease --title "Tawreed Desktop ${TAG#desktop-v}" --notes "${notes}"
          else
            gh release create "${TAG}" --target "${GITHUB_SHA}" --draft --prerelease --title "Tawreed Desktop ${TAG#desktop-v}" --notes "${notes}"
          fi

  build-portable:
    needs: prepare-release
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows portable x64
            platform: windows-latest
            build_args: --no-bundle
            kind: windows
          - name: Linux portable x64
            platform: ubuntu-22.04
            build_args: --bundles appimage
            kind: linux
          - name: macOS portable
            platform: macos-latest
            build_args: --no-bundle
            kind: macos
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Python engine
        run: python -m pip install -e ".[dev]"

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Verify before release
        working-directory: desktop
        run: pnpm check

      - name: Build direct portable executable
        working-directory: desktop
        run: pnpm exec tauri build ${{ matrix.build_args }}

      - name: Prepare Windows executable
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item "desktop/src-tauri/target/release/tawreed-desktop.exe" "release/Tawreed-Windows-x64.exe"

      - name: Prepare Linux AppImage
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          mkdir -p release
          mapfile -t appimages < <(find desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage')
          if [[ "${#appimages[@]}" -ne 1 ]]; then
            echo "Expected exactly one AppImage, found ${#appimages[@]}." >&2
            exit 1
          fi
          cp "${appimages[0]}" "release/Tawreed-Linux-x64.AppImage"
          chmod +x "release/Tawreed-Linux-x64.AppImage"

      - name: Prepare raw macOS executable
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          architecture="$(uname -m)"
          cp "desktop/src-tauri/target/release/tawreed-desktop" "release-Tawreed-macOS-${architecture}"
          chmod +x "release-Tawreed-macOS-${architecture}"
          codesign --force --sign - --timestamp=none "release-Tawreed-macOS-${architecture}"
          mkdir -p release
          mv "release-Tawreed-macOS-${architecture}" "release/Tawreed-macOS-${architecture}"

      - name: Reject installer and archive output
        working-directory: desktop
        run: pnpm check:portable-policy

      - name: Upload executable directly to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem release -File)
          if ($assets.Count -ne 1) {
            throw "Expected exactly one direct executable release asset, found $($assets.Count)."
          }
          gh release upload "$env:TAG" "$($assets[0].FullName)" --clobber
