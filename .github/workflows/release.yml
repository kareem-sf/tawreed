name: Release
# Builds Tawreed on push of a `v*` tag, or via manual trigger, and
# attaches the platform-specific PyInstaller onefile build as a
# workflow artifact. PyInstaller produces a single ``Tawreed.exe``
# / ``Tawreed`` binary that contains the bootloader + every
# dependency, so the end user just downloads a single file and
# double-clicks it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      # Same PySide6 system deps as ci.yml — the test step below
      # needs libEGL/libGL even on the offscreen QPA platform.
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xfixes0 libdbus-1-3

      # Build in a CLEAN ephemeral venv. If we let PyInstaller
      # pick up the host's site-packages, it can pull in
      # unrelated libraries (numpy, pandas, PIL) that the
      # .spec's excludes list tries to drop, but a stale venv
      # is the #1 cause of "the binary works on my machine
      # but is 200 MB on CI". ``uv venv`` + reinstall every
      # time is the only way to make the build reproducible.
      # NOTE: each OS needs its own step with its own shell
      # because venv activation paths differ (bin/activate on
      # POSIX, Scripts\activate.bat on Windows) and the default
      # shell on Windows runners is PowerShell, not cmd.
      - name: Create build venv (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python -m venv .build-venv
          . .build-venv/bin/activate
          pip install -U pip
          pip install -e ".[dev]"
      - name: Create build venv (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        # cmd.exe can't source the bash-style `activate` script
        # shipped in `Scripts\` (no extension) — only the
        # `.bat` version. Rather than depend on shell activation
        # (which is fragile across GitHub's wrapping with CALL),
        # invoke the venv's Python directly to install into it.
        # The `if not exist` guard skips if the venv already
        # exists from a previous step.
        run: |
          if not exist .build-venv\Scripts\python.exe python -m venv .build-venv
          .build-venv\Scripts\python.exe -m pip install -U pip
          .build-venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: . .build-venv/bin/activate && pytest -q
      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        # Windows cmd.exe's `CALL activate && pytest` runs pytest
        # in a fresh subshell that has lost the venv's PATH
        # mutation. Invoke pytest via the venv's Python directly
        # so we don't depend on shell activation at all.
        run: .build-venv\Scripts\python.exe -m pytest -q

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: . .build-venv/bin/activate && pyinstaller tawreed.spec --noconfirm
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        # Same reasoning as the Test step: invoke the venv's
        # Python directly so cmd.exe subshell semantics don't
        # drop the activation.
        run: .build-venv\Scripts\python.exe -m PyInstaller tawreed.spec --noconfirm

      - name: Show binary size (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: ls -la dist/
      - name: Show binary size (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tawreed-${{ matrix.os }}
          path: |
            dist/Tawreed.exe
            dist/Tawreed
          if-no-files-found: error

  publish:
    # The `publish` job runs once all 3 platform builds have
    # finished, downloads the per-platform artifacts, and
    # attaches them to a GitHub Release for tag `v*`.
    # On a `workflow_dispatch` (manual) run it still publishes
    # so the v0.0.1 re-tag is reproducible.
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for softprops/action-gh-release to create the release
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Show downloaded artifacts
        run: ls -la artifacts/

      - name: Rename binaries to avoid asset name collision
        # macOS and Linux both produce a binary literally named
        # `Tawreed` (no extension). If we attach them as-is,
        # softprops stores one asset per filename and the
        # second upload silently overwrites the first. Rename
        # so each platform gets its own asset key in the
        # release (`Tawreed-windows.exe`, `Tawreed-macos`,
        # `Tawreed-linux`).
        run: |
          if [ -f artifacts/tawreed-windows-latest/Tawreed.exe ]; then
            cp artifacts/tawreed-windows-latest/Tawreed.exe \
               artifacts/tawreed-windows-latest/Tawreed-windows.exe
          fi
          if [ -f artifacts/tawreed-macos-latest/Tawreed ]; then
            cp artifacts/tawreed-macos-latest/Tawreed \
               artifacts/tawreed-macos-latest/Tawreed-macos
          fi
          if [ -f artifacts/tawreed-ubuntu-latest/Tawreed ]; then
            cp artifacts/tawreed-ubuntu-latest/Tawreed \
               artifacts/tawreed-ubuntu-latest/Tawreed-linux
          fi
          ls -la artifacts/tawreed-*/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # github.ref_name already includes the leading `v`
          # (e.g. `v0.0.1`), so the release name is just the
          # ref name, not `v${{ github.ref_name }}` (which would
          # produce `vv0.0.1`).
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # Attach the renamed per-platform binaries so each
          # platform has a unique asset name in the release.
          files: |
            artifacts/tawreed-windows-latest/Tawreed-windows.exe
            artifacts/tawreed-macos-latest/Tawreed-macos
            artifacts/tawreed-ubuntu-latest/Tawreed-linux
          fail_on_unmatched_files: true
