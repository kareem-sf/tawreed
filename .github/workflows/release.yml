name: Release

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing v-prefixed release tag to build and populate
        required: true
        type: string
      release_sha:
        description: Immutable commit SHA referenced by the release tag
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed release tag to build and populate
        required: true
        type: string
      release_sha:
        description: Immutable commit SHA referenced by the release tag
        required: true
        type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Stage GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Create or hide the release during verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --silent
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | [.id, .draft] | @tsv")"
          count="$(printf '%s\n' "$releases" | sed '/^$/d' | wc -l)"
          if [[ "$count" -gt 1 ]]; then
            echo "Multiple releases exist for $tag; refusing automated recovery." >&2
            exit 1
          fi
          if [[ "$count" -eq 0 ]]; then
            gh release create "$tag" \
              --draft \
              --generate-notes \
              --title "Tawreed $tag" \
              --verify-tag
          else
            release_id="$(printf '%s' "$releases" | cut -f1)"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -F draft=true \
              --silent
          fi

  audit:
    name: Audit Rust dependencies
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit -f src-tauri/Cargo.lock

  build:
    name: Build ${{ matrix.name }}
    needs: [audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            artifact: windows-x64
            rust-targets: x86_64-pc-windows-msvc
          - name: Linux x64
            runner: ubuntu-24.04
            artifact: linux-x64
            rust-targets: x86_64-unknown-linux-gnu
          - name: macOS universal
            runner: macos-15-intel
            artifact: macos-universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            xvfb

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.rust-targets }}
          components: clippy,rustfmt

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tag version
        run: npm run verify:version -- "${{ inputs.release_tag || github.ref_name }}"

      - name: Verify frontend, tests, build, assets, and version
        run: npm run check

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Audit npm dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Build Windows portable executable
        if: runner.os == 'Windows'
        run: npm run tauri -- build --no-bundle --ci -- --locked

      - name: Build Linux packages
        if: runner.os == 'Linux'
        run: npm run tauri -- build --bundles appimage,deb --ci -- --locked

      - name: Build universal macOS package
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        # The DMG packaging step (bundle_dmg.sh / hdiutil / Finder) is flaky on
        # GitHub's macOS runners and can fail transiently even after a clean build,
        # so retry the whole build a few times before giving up.
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run tauri -- build --target universal-apple-darwin --bundles dmg --ci -- --locked; then
              exit 0
            fi
            echo "macOS DMG build attempt ${attempt} failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "macOS DMG build failed after 3 attempts" >&2
          exit 1

      - name: Prepare Windows release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "release" -Force | Out-Null
          Copy-Item "src-tauri/target/release/tawreed.exe" "release/Tawreed-Windows-x64.exe"
          $exe = Get-Item "release/Tawreed-Windows-x64.exe"
          $expected = (Get-Content "package.json" | ConvertFrom-Json).version
          if ($exe.Length -lt 10MB) { throw "Portable executable is unexpectedly small." }
          if ($exe.VersionInfo.ProductVersion -ne $expected) {
            throw "Executable version $($exe.VersionInfo.ProductVersion) does not match $expected."
          }
          if ((Get-AuthenticodeSignature $exe.FullName).Status -ne "NotSigned") {
            throw "The unsigned-release policy changed unexpectedly; review signing and documentation."
          }
          $process = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Tawreed exited during the startup smoke test." }
          Stop-Process -Id $process.Id -Force

      - name: Prepare Linux release assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#appimages[@]}" -eq 1
          test "${#debs[@]}" -eq 1
          test "$(stat -c '%s' "${appimages[0]}")" -gt 10000000
          cp "${appimages[0]}" release/Tawreed-Linux-x64.AppImage
          cp "${debs[0]}" release/Tawreed-Linux-x64.deb
          xvfb-run -a bash -c '
            set -euo pipefail
            src-tauri/target/release/tawreed &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            sleep 8
            kill -0 "$pid"
          '

      - name: Prepare macOS release asset
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          dmgs=("$bundle"/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          test "$(stat -f '%z' "${dmgs[0]}")" -gt 10000000
          mount_dir="$(mktemp -d)"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" 2>/dev/null || true' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "${dmgs[0]}"
          app="$mount_dir/Tawreed.app"
          archs="$(lipo -archs "$app/Contents/MacOS/tawreed")"
          [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
          codesign --verify --deep --strict "$app"
          mkdir release
          cp "${dmgs[0]}" release/Tawreed-macOS-universal.dmg

      - name: Upload verified platform payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tawreed-${{ inputs.release_tag || github.ref_name }}-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

  legal:
    name: Generate legal payload
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.97.0

      - name: Generate notices and dependency licenses
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          mkdir release
          cp THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md
          node scripts/generate-third-party-licenses.cjs release/LICENSES.txt

      - name: Upload verified legal payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tawreed-${{ inputs.release_tag || github.ref_name }}-legal
          path: release/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attest and publish
    needs: [build, legal]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download verified release payloads
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: tawreed-${{ inputs.release_tag || github.ref_name }}-*
          path: release
          merge-multiple: true

      - name: Verify immutable payload and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=$'LICENSES.txt\nTHIRD_PARTY_NOTICES.md\nTawreed-Linux-x64.AppImage\nTawreed-Linux-x64.deb\nTawreed-Windows-x64.exe\nTawreed-macOS-universal.dmg'
          actual="$(find release -maxdepth 1 -type f -printf '%f\n' | sort)"
          test "$actual" = "$expected"
          (cd release && sha256sum Tawreed-Linux-x64.AppImage Tawreed-Linux-x64.deb Tawreed-Windows-x64.exe Tawreed-macOS-universal.dmg >SHA256SUMS.txt)
          (cd release && sha256sum --check SHA256SUMS.txt)

      - name: Attest platform packages
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release/Tawreed-Linux-x64.AppImage
            release/Tawreed-Linux-x64.deb
            release/Tawreed-Windows-x64.exe
            release/Tawreed-macOS-universal.dmg

      - name: Populate and verify the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --silent

          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$tag\") | [.id, .draft] | @tsv")"
          if [[ "$(printf '%s\n' "$releases" | sed '/^$/d' | wc -l)" -gt 1 ]]; then
            echo "Multiple releases exist for $tag; refusing automated recovery." >&2
            exit 1
          fi

          if [[ -z "$releases" ]]; then
            # Manual tag fallback: Release Please normally creates this release.
            gh release create "$tag" \
              --draft \
              --generate-notes \
              --title "Tawreed $tag" \
              --verify-tag
            releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$tag\") | [.id, .draft] | @tsv")"
          fi
          release_id="$(printf '%s' "$releases" | cut -f1)"
          test -n "$release_id"

          gh release upload "$tag" --clobber \
            release/LICENSES.txt \
            release/SHA256SUMS.txt \
            release/THIRD_PARTY_NOTICES.md \
            release/Tawreed-Linux-x64.AppImage \
            release/Tawreed-Linux-x64.deb \
            release/Tawreed-Windows-x64.exe \
            release/Tawreed-macOS-universal.dmg

          expected=$'LICENSES.txt\nSHA256SUMS.txt\nTHIRD_PARTY_NOTICES.md\nTawreed-Linux-x64.AppImage\nTawreed-Linux-x64.deb\nTawreed-Windows-x64.exe\nTawreed-macOS-universal.dmg'
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.assets[].name' | sort)"
          if [[ "$actual" != "$expected" ]]; then
            echo "Release asset set is not exact; refusing publication." >&2
            exit 1
          fi

          marker="<!-- tawreed-desktop-packages -->"
          current_body="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.body // ""')"
          if [[ "$current_body" != *"$marker"* ]]; then
            cat >PACKAGE_NOTES.md <<'EOF'
          <!-- tawreed-desktop-packages -->

          ### Verified desktop packages

          - Windows x64: `Tawreed-Windows-x64.exe`
          - Linux x64: `Tawreed-Linux-x64.AppImage` or `Tawreed-Linux-x64.deb`
          - macOS Intel and Apple Silicon: `Tawreed-macOS-universal.dmg`

          Packages are not signed with commercial platform certificates.
          Verify `SHA256SUMS.txt` and GitHub build provenance before installation.
          EOF
            current_body="${current_body}"$'\n\n'"$(cat PACKAGE_NOTES.md)"
          fi

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f name="Tawreed $tag" \
            -f body="$current_body" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true \
            --silent
