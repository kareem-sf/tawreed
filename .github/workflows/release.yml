name: Release build

# Builds the Windows installer, the Linux AppImage and the macOS app (Apple Silicon and Intel) for one version and
# keeps them as workflow artifacts. Nothing is published here: the update archives are signed for the updater with
# the private key, which never goes to GitHub, and then attached to a GitHub release by "Publish release".
# Started by hand (Actions > Release build).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: nsis
            bundles: nsis
            python: service/.venv/Scripts/python
            service: service/dist/tawreed-service/tawreed-service.exe
            files: desktop/target/release/bundle/nsis/*.exe
          # The oldest supported Ubuntu, so the AppImage runs on as many Linux systems as possible.
          - os: ubuntu-22.04
            artifact: appimage
            bundles: appimage
            python: service/.venv/bin/python
            service: service/dist/tawreed-service/tawreed-service
            files: desktop/target/release/bundle/appimage/*.AppImage
          # macOS 14 runners end on 2 November 2026 and macOS 13 is gone: 15 is the oldest left on each chip.
          - os: macos-15
            artifact: macos-aarch64
            arch: aarch64
            bundles: app,dmg
            python: service/.venv/bin/python
            files: stage/*
          - os: macos-15-intel
            artifact: macos-x64
            arch: x64
            bundles: app,dmg
            python: service/.venv/bin/python
            files: stage/*
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      # The version is in rust-toolchain.toml too; keep the two the same.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.99.1"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      # cryptography has published no Intel Mac wheel since 46.0.3, so it is built here. Linked to Homebrew's
      # OpenSSL as a shared library it clashes with the older libssl the frozen service carries for Python itself
      # (Symbol not found: _SSL_get0_group_name); built with OpenSSL inside it, it needs no libssl at all.
      - if: runner.os == 'macOS' && matrix.arch == 'x64'
        run: |
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
      # Python packages come from service/requirements.lock, with hashes, so every build uses the same files.
      - name: Install the service
        run: |
          python -m venv service/.venv
          ${{ matrix.python }} -m pip install --require-hashes -r service/requirements.lock
          ${{ matrix.python }} -m pip install --no-deps -e ./service
      - if: runner.os == 'macOS'
        name: cryptography carries its own OpenSSL
        run: |
          binding=$(${{ matrix.python }} -c 'import cryptography.hazmat.bindings._rust as m; print(m.__file__)')
          otool -L "$binding"
          if otool -L "$binding" | grep -q libssl; then echo "cryptography links a shared libssl"; exit 1; fi
      - run: npm ci
      - name: Service tests
        run: ${{ matrix.python }} -m pytest service
      - name: Release script tests
        run: npm run test:release
      # Thmanyah is not in the repository (licence): these builds use the bundled IBM Plex Sans Arabic for Arabic.
      - name: Freeze the service
        run: npm run package:service
      - name: Smoke test the frozen service
        if: runner.os != 'macOS'
        run: node scripts/smoke-service.mjs "${{ matrix.service }}"
      # The updater signatures are made afterwards with the private key, outside GitHub, so no updater files here.
      # --locked builds exactly what Cargo.lock says. macOS gets three tries: making the DMG sometimes fails
      # for no reason that a second try does not fix.
      - name: Build without signing
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          node -e 'const f="desktop/tauri.release.conf.json",fs=require("fs"),c=JSON.parse(fs.readFileSync(f));c.bundle.createUpdaterArtifacts=false;c.bundle.targets=process.env.BUNDLES.split(",");fs.writeFileSync(f,JSON.stringify(c,null,2))'
          attempts=1
          if [ "$RUNNER_OS" = "macOS" ]; then attempts=3; fi
          for attempt in $(seq 1 "$attempts"); do
            if npm run tauri -- build --config desktop/tauri.release.conf.json -- --locked; then exit 0; fi
            echo "Build attempt $attempt of $attempts failed."
            sleep 20
          done
          exit 1
      # The updater downloads the zipped app, so it is made by hand here (the signature is added later).
      - name: macOS update archive, checks and smoke test
        if: runner.os == 'macOS'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./package.json").version')
          bundle=desktop/target/release/bundle
          codesign --verify --deep --strict --verbose=2 "$bundle/macos/Tawreed.app"
          mkdir stage
          (cd "$bundle/macos" && COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "$GITHUB_WORKSPACE/stage/Tawreed_${VERSION}_${ARCH}.app.tar.gz" Tawreed.app)
          cp "$bundle/dmg/Tawreed_${VERSION}_${ARCH}.dmg" stage/
          test "$(tar -tzf "stage/Tawreed_${VERSION}_${ARCH}.app.tar.gz" | cut -d/ -f1 | sort -u)" = "Tawreed.app"
          unpacked=$(mktemp -d)
          tar -xzf "stage/Tawreed_${VERSION}_${ARCH}.app.tar.gz" -C "$unpacked"
          codesign --verify --deep --strict --verbose=2 "$unpacked/Tawreed.app"
          node scripts/smoke-service.mjs "$unpacked/Tawreed.app/Contents/Resources/service/tawreed-service"
          ls -l stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
