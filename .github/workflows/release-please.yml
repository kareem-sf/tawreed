name: Automated Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Version, changelog, and release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Create or update the release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Check out the release pull request
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          fetch-depth: 0

      - name: Synchronize desktop version manifests
        if: steps.release.outputs.prs_created == 'true'
        run: npm run sync:version

      - name: Commit synchronized desktop versions
        if: steps.release.outputs.prs_created == 'true'
        shell: bash
        env:
          HEAD_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m "chore: synchronize desktop release version"
          git push origin "HEAD:${HEAD_BRANCH}"

      # GITHUB_TOKEN-created pull requests do not emit pull_request events.
      # Explicit workflow_dispatch is the documented exception, so dispatch CI
      # on the bot branch and let branch protection gate auto-merge normally.
      - name: Validate and auto-merge the release pull request
        if: steps.release.outputs.prs_created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          pr_number="$(jq -r '.number' <<<"$RELEASE_PR")"
          head_branch="$(jq -r '.headBranchName' <<<"$RELEASE_PR")"
          test "$pr_number" != "null"
          test -n "$head_branch"
          gh workflow run ci.yml --ref "$head_branch"
          gh pr merge "$pr_number" --auto --squash --delete-branch

  release-assets:
    name: Build and publish release assets
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.release-please.outputs.tag_name }}
      release_sha: ${{ needs.release-please.outputs.release_sha }}
