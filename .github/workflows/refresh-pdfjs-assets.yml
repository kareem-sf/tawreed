name: Refresh PDF.js assets

on:
  push:
    branches:
      - security/high-dependency-advisories-2026-08

permissions:
  contents: write

concurrency:
  group: refresh-pdfjs-assets
  cancel-in-progress: false

jobs:
  refresh:
    name: Sync locked PDF.js runtime assets
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out security branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked packages without install scripts
        run: npm ci --ignore-scripts --no-audit

      - name: Synchronize and verify PDF.js runtime assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/pdfjs/cmaps public/pdfjs/standard_fonts public/pdfjs/wasm
          mkdir -p public/pdfjs
          cp -R node_modules/pdfjs-dist/cmaps public/pdfjs/cmaps
          cp -R node_modules/pdfjs-dist/standard_fonts public/pdfjs/standard_fonts
          cp -R node_modules/pdfjs-dist/wasm public/pdfjs/wasm
          node scripts/verify-vendor-assets.cjs
          git diff --check
          if git diff --quiet -- public/pdfjs; then
            echo 'PDF.js runtime assets did not change' >&2
            exit 1
          fi

      - name: Commit synchronized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/pdfjs
          git commit -m 'fix(security): synchronize patched PDF.js assets'
          git push origin "HEAD:${GITHUB_REF_NAME}"
