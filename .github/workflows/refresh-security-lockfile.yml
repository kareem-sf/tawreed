name: Refresh security lockfile

on:
  push:
    branches:
      - security/high-dependency-advisories-2026-08

permissions:
  contents: write

concurrency:
  group: refresh-security-lockfile
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate patched npm lockfile
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out security branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Regenerate and verify lockfile without install scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit --audit-level=high --omit=dev
          git diff --check
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json did not change' >&2
            exit 1
          fi

      - name: Commit deterministic lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(security): regenerate patched dependency lockfile'
          git push origin "HEAD:${GITHUB_REF_NAME}"
