[project]
name = "tawreed"
version = "0.1.0"
description = "Tawreed service: BOQs in, procurement packages out"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.54",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "pydantic>=2.13",
    "python-multipart>=0.0.32",
    "pydantic-ai-slim[anthropic,google,openai,xai]>=2.51",
    "pillow>=12.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx2>=2.13",
    "ruff>=0.16",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tawreed*"]

[tool.setuptools.package-data]
"tawreed.migrations" = ["script.py.mako", "versions/*.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
