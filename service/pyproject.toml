[project]
name = "tawreed"
version = "0.0.1"
description = "Tawreed service: BOQs in, procurement packages out"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.54",
    "sqlalchemy>=2.1",
    "alembic>=1.20",
    "pydantic>=2.13",
    "python-multipart>=0.0.32",
    "pydantic-ai-slim[anthropic,google,openai,xai]>=2.51",
    "mcp>=2.2",  # serves Tawreed's tools to the Codex client
    "pillow>=12.3",
    "openpyxl>=3.1.5",
    "python-calamine>=0.8",
    "pypdfium2>=5.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "httpx2>=2.13",
    "ruff>=0.16",
    "fpdf2>=2.8",  # writes the synthetic PDF fixtures
    "uharfbuzz>=0.56",  # Arabic text shaping for those fixtures
    "pyinstaller>=6.16",  # freezes the service for the desktop installer
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tawreed*"]

[tool.setuptools.package-data]
"tawreed.migrations" = ["script.py.mako", "versions/*.py"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
